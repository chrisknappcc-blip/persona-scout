<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Scout · Care Continuity</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#F0F4FA;color:#1A2B4A;min-height:100vh}
.bar{background:#1A2B4A;padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:28px;height:28px;border-radius:7px;background:#3B82F6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.bar-title{color:#fff;font-weight:700;font-size:14px}
.bar-sub{color:#94A3B8;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.pill-g{background:#DCFCE7;color:#16A34A}
.pill-a{background:#FEF3C7;color:#D97706}
.pill-m{background:#F1F5F9;color:#64748B;border:0.5px solid #E2E8F0}
.body{padding:24px 20px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 54px);padding:24px}
.upload-card{max-width:520px;width:100%}
h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.4px}
.usub{color:#64748B;line-height:1.65;margin-bottom:20px;font-size:13px}
.dz{border:1.5px dashed #CBD5E1;border-radius:14px;padding:40px 24px;text-align:center;cursor:pointer;background:#fff;transition:all .15s}
.dz:hover,.dz.over{border-color:#3B82F6;background:#EFF6FF}
.dz-icon{font-size:32px;margin-bottom:10px}
.dz-label{font-weight:600;margin-bottom:4px}
.dz-sub{color:#94A3B8;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:#F1F5F9;padding:3px 10px;border-radius:6px;font-size:11px;color:#475569;border:0.5px solid #E2E8F0}
.chip-lbl{font-size:11px;color:#94A3B8;align-self:center}
.tw{background:#fff;border-radius:12px;overflow:hidden;border:0.5px solid #E2E8F0;margin-bottom:14px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:#F8FAFC;border-bottom:0.5px solid #E2E8F0}
th{padding:9px 13px;text-align:left;font-size:10px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
tbody tr{border-bottom:0.5px solid #F1F5F9}
tbody tr:last-child{border-bottom:none}
td{padding:8px 13px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.more td{text-align:center;color:#94A3B8;font-size:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
button{cursor:pointer;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;transition:opacity .1s}
.btn-p{background:#1A2B4A;color:#fff;border:none}
.btn-p:hover{opacity:.85}
.btn-g{background:#fff;color:#64748B;border:0.5px solid #CBD5E1}
.btn-g:hover{background:#F8FAFC}
.btn-sm{padding:3px 9px;font-size:11px;border-radius:6px}
.btn-ok{background:#DCFCE7;color:#16A34A;border:0.5px solid #86EFAC}
.btn-ok:hover{opacity:.8}
.btn-sk{background:#F1F5F9;color:#64748B;border:none}
.btn-sk:hover{background:#E2E8F0}
.btn-undo{background:#F1F5F9;color:#94A3B8;border:none;font-weight:400}
.btn-ex{background:#1A2B4A;color:#fff;border:none}
.btn-ex:hover{opacity:.85}
.btn-hc{background:#fff;color:#16A34A;border:0.5px solid #86EFAC;padding:7px 12px;font-size:12px}
.btn-hc:hover{background:#F0FDF4}
.btn-aa{background:#fff;color:#3B82F6;border:0.5px solid #93C5FD;padding:7px 12px;font-size:12px}
.btn-aa:hover{background:#EFF6FF}
.proc-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 54px);gap:18px;text-align:center;padding:24px}
.proc-icon{font-size:40px}
.proc-title{font-size:18px;font-weight:600}
.proc-sub{color:#64748B;font-size:13px;max-width:380px;line-height:1.6}
.prog-track{width:320px;height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:#3B82F6;border-radius:99px;transition:width .3s}
.proc-stat{color:#94A3B8;font-size:12px}
.err{background:#FEF2F2;border:0.5px solid #FECACA;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:#DC2626;line-height:1.6}
.stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sc{background:#fff;border:0.5px solid #E2E8F0;border-radius:10px;padding:10px 14px;min-width:86px}
.sc-n{font-size:20px;font-weight:600}
.sc-l{font-size:10px;color:#94A3B8;text-transform:uppercase;letter-spacing:.04em}
.ctrls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.ctrls input,.ctrls select{font-size:12px;padding:7px 11px;border-radius:8px;border:0.5px solid #CBD5E1;background:#fff;color:#1A2B4A;font-family:inherit}
.ctrls input{flex:1;min-width:150px}
.pchip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:0.5px solid;white-space:nowrap}
.nm{color:#CBD5E1;font-size:11px;font-style:italic}
.cb{display:flex;align-items:center;gap:5px}
.ct{width:36px;height:3px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.cf{height:100%;border-radius:99px}
.rc{color:#94A3B8;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acell{display:flex;gap:3px}
.row-ok{background:#F0FDF4!important}
.row-sk{opacity:.55}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">⬡</div>
  <div><div class="bar-title">Persona Scout</div><div class="bar-sub">Care Continuity · Cipher</div></div>
  <div class="pills" id="bpills"></div>
</div>
<div id="main"></div>

<script>
const PCOLS={"Executive/Leadership":"#7C3AED","Clinical Operations":"#0284C7","Finance":"#059669","Operating Officer":"#D97706","Nursing Officer":"#DB2777","Strategy":"#2563EB","Business Development":"#16A34A","Innovation":"#6D28D9","Ambulatory/Urgent Care":"#0D9488","Medical Officer":"#DC2626","Patient Experience":"#C2410C","Population Health":"#047857","Emergency Department":"#B91C1C","Medical Group":"#1D4ED8","Chief Clinical Officer":"#9A3412","Medical Information (Medical)":"#4338CA","Quality Officer":"#92400E","Access/Patient Access":"#0E7490","Case Management":"#065F46","Value Based Care":"#1E40AF","Physician Executive":"#6B21A8","Service Line":"#155E75","Vendor/Payor":"#374151"};
const PERSONA_NAMES=Object.keys(PCOLS);

let contacts=[],results=[],fp='all',fs='all',sq='',sb='company',lastErr='';

function dc(hdrs){
  const h=hdrs.map(x=>({o:x,l:x.toLowerCase().replace(/[^a-z0-9]/g,'')}));
  const f=(...ps)=>{for(const p of ps){const m=h.find(x=>x.l.includes(p));if(m)return m.o;}return null;};
  return{id:f('recordid','contactid','id'),fn:f('firstname','first'),ln:f('lastname','last'),title:f('jobtitle','title','position'),co:f('companyname','company','organization'),email:f('email')};
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function handleFile(file){
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:res=>{
    const hdrs=res.meta.fields||[];
    const cols=dc(hdrs);
    contacts=res.data.filter(r=>r[cols.title]?.trim()).map((r,i)=>({
      id:r[cols.id]||String(i),fn:r[cols.fn]||'',ln:r[cols.ln]||'',
      title:(r[cols.title]||'').trim(),company:r[cols.co]||'',email:r[cols.email]||''
    }));
    renderPreview();
  }});
}

async function classifyBatch(batch){
  const resp=await fetch('/.netlify/functions/classify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contacts:batch.map(c=>({id:c.id,title:c.title,company:c.company}))})
  });
  if(!resp.ok){const t=await resp.text();throw new Error(`Function ${resp.status}: ${t.slice(0,300)}`);}
  const d=await resp.json();
  if(d.error)throw new Error(d.error);
  return d.results||[];
}

function renderUpload(){
  document.getElementById('bpills').innerHTML='';
  document.getElementById('main').innerHTML=`
  <div class="center"><div class="upload-card">
    <h1>Who's missing from your personas?</h1>
    <div class="usub">Import a CSV of untagged contacts. Persona Scout reads every job title, understands the variations, and recommends the right persona — ready to push back into HubSpot.</div>
    <div class="dz" id="dz" tabindex="0" role="button">
      <div class="dz-icon">📋</div>
      <div class="dz-label">Drop your CSV here</div>
      <div class="dz-sub">or click to browse · HubSpot export format works directly</div>
      <input type="file" id="fi" accept=".csv" style="display:none">
    </div>
    <div class="chips">
      <span class="chip-lbl">Columns:</span>
      <span class="chip">Record ID</span><span class="chip">First Name</span><span class="chip">Last Name</span>
      <span class="chip">Job Title</span><span class="chip">Company Name</span><span class="chip">Email</span>
    </div>
  </div></div>`;
  bindDZ();
}

function bindDZ(){
  const dz=document.getElementById('dz'),fi=document.getElementById('fi');
  if(!dz||!fi)return;
  dz.onclick=()=>fi.click();
  dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')fi.click();};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f);};
  fi.onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0]);};
}

function renderPreview(){
  const shown=contacts.slice(0,7),more=contacts.length-7;
  document.getElementById('main').innerHTML=`
  <div class="body">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:16px">
      <div style="font-size:18px;font-weight:600">Ready to classify</div>
      <div style="font-size:13px;color:#64748B">${contacts.length.toLocaleString()} contacts with job titles</div>
    </div>
    <div class="tw"><table>
      <colgroup><col style="width:22%"><col style="width:44%"><col style="width:34%"></colgroup>
      <thead><tr><th>Name</th><th>Job title</th><th>Company</th></tr></thead>
      <tbody>
        ${shown.map(c=>`<tr><td style="font-weight:500">${esc(c.fn)} ${esc(c.ln)}</td><td style="color:#475569">${esc(c.title)}</td><td style="color:#94A3B8">${esc(c.company)}</td></tr>`).join('')}
        ${more>0?`<tr class="more"><td colspan="3">+ ${more.toLocaleString()} more</td></tr>`:''}
      </tbody>
    </table></div>
    <div class="btn-row">
      <button class="btn-p" onclick="startClassify()">Classify with AI →</button>
      <button class="btn-g" onclick="renderUpload()">Upload different file</button>
    </div>
  </div>`;
}

async function startClassify(){
  const BATCH=20;
  const batches=[];
  for(let i=0;i<contacts.length;i+=BATCH)batches.push(contacts.slice(i,i+BATCH));
  results=[];lastErr='';
  document.getElementById('main').innerHTML=`
  <div class="proc-wrap">
    <div class="proc-icon">🔍</div>
    <div class="proc-title">Classifying contacts...</div>
    <div class="proc-sub" id="pm">Starting...</div>
    <div class="prog-track"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="proc-stat" id="ps">0 of ${contacts.length.toLocaleString()} processed</div>
    <div class="err" id="proc-err" style="display:none"></div>
  </div>`;

  for(let bi=0;bi<batches.length;bi++){
    const batch=batches[bi];
    const pct=Math.round(results.length/contacts.length*100);
    const pf=document.getElementById('pf'),ps=document.getElementById('ps'),pm=document.getElementById('pm');
    if(pf)pf.style.width=pct+'%';
    if(ps)ps.textContent=`${results.length.toLocaleString()} of ${contacts.length.toLocaleString()} processed`;
    if(pm)pm.textContent=`Batch ${bi+1} of ${batches.length}...`;

    let classified=[];
    try{classified=await classifyBatch(batch);}
    catch(e){
      lastErr=e.message;
      const eb=document.getElementById('proc-err');
      if(eb){eb.style.display='block';eb.innerHTML=`<strong>Error on batch ${bi+1}:</strong> ${esc(e.message)}`;}
      classified=batch.map(c=>({id:c.id,persona:null,confidence:0,reason:'error'}));
    }

    const merged=batch.map(c=>{
      const r=classified.find(x=>String(x.id)===String(c.id))||{};
      const p=r.persona||null;
      return{...c,sp:p,fp:p,conf:r.confidence||0,reason:r.reason||'',status:p?'pending':'skipped'};
    });
    results.push(...merged);
    await new Promise(r=>setTimeout(r,100));
  }

  const pf=document.getElementById('pf'),ps=document.getElementById('ps');
  if(pf)pf.style.width='100%';
  if(ps)ps.textContent=`${contacts.length.toLocaleString()} of ${contacts.length.toLocaleString()} processed`;
  await new Promise(r=>setTimeout(r,400));
  renderReview();
}

function gv(){
  return results.filter(r=>{
    if(fs!=='all'&&r.status!==fs)return false;
    if(fp==='__none'&&r.sp)return false;
    if(fp!=='all'&&fp!=='__none'&&r.sp!==fp)return false;
    if(sq){const q=sq.toLowerCase();return(`${r.fn} ${r.ln}`).toLowerCase().includes(q)||r.title.toLowerCase().includes(q)||r.company.toLowerCase().includes(q);}
    return true;
  }).sort((a,b)=>{
    if(sb==='confidence')return b.conf-a.conf;
    if(sb==='persona')return(a.sp||'').localeCompare(b.sp||'');
    if(sb==='name')return(a.ln||'').localeCompare(b.ln||'');
    return(a.company||'').localeCompare(b.company||'');
  });
}

function apv(id){const r=results.find(x=>x.id===id);if(r){r.status='approved';r.fp=r.sp;}rt();}
function skp(id){const r=results.find(x=>x.id===id);if(r)r.status='skipped';rt();}
function und(id){const r=results.find(x=>x.id===id);if(r)r.status='pending';rt();}
function approveAll(){results.forEach(r=>{if(r.sp){r.status='approved';r.fp=r.sp;}});rt();}
function approveHC(){results.forEach(r=>{if(r.conf>=80&&r.sp){r.status='approved';r.fp=r.sp;}});rt();}

function doExport(){
  const ok=results.filter(r=>r.status==='approved'&&r.fp);
  if(!ok.length){alert('No approved contacts yet.');return;}
  const rows=[['Record ID','First Name','Last Name','Email','Target Persona'],...ok.map(r=>[r.id,r.fn,r.ln,r.email,r.fp])];
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='persona_assignments.csv';a.click();
}

function renderReview(){
  const ap=results.filter(r=>r.status==='approved').length;
  const pe=results.filter(r=>r.status==='pending').length;
  const sk=results.filter(r=>r.status==='skipped').length;
  document.getElementById('bpills').innerHTML=`<span class="pill pill-g">${ap} approved</span><span class="pill pill-a">${pe} pending</span><span class="pill pill-m">${sk} no match</span>`;

  const pOpts=['<option value="all">All personas</option>',...PERSONA_NAMES.map(p=>`<option value="${p}">${p}</option>`),'<option value="__none">No match</option>'].join('');

  document.getElementById('main').innerHTML=`
  <div class="body">
    ${lastErr?`<div class="err"><strong>Note:</strong> Some batches hit an error: ${esc(lastErr)}</div>`:''}
    <div class="stat-row">
      <div class="sc"><div class="sc-n">${results.length.toLocaleString()}</div><div class="sc-l">Total</div></div>
      <div class="sc" style="border-color:#FDE68A"><div class="sc-n" style="color:#D97706">${pe}</div><div class="sc-l">Pending</div></div>
      <div class="sc" style="border-color:#BBF7D0"><div class="sc-n" style="color:#16A34A">${ap}</div><div class="sc-l">Approved</div></div>
      <div class="sc"><div class="sc-n" style="color:#94A3B8">${sk}</div><div class="sc-l">No match</div></div>
      <div style="margin-left:auto"><button class="btn-ex" onclick="doExport()">↓ Export ${ap} approved</button></div>
    </div>
    <div class="ctrls">
      <input type="text" placeholder="Search name, title, company..." oninput="sq=this.value;rt()">
      <select id="psel" onchange="fp=this.value;rt()">${pOpts}</select>
      <select id="ssel" onchange="fs=this.value;rt()">
        <option value="all">All statuses</option><option value="pending">Pending</option>
        <option value="approved">Approved</option><option value="skipped">No match</option>
      </select>
      <select id="osel" onchange="sb=this.value;rt()">
        <option value="company">Sort: company</option><option value="confidence">Sort: confidence</option>
        <option value="persona">Sort: persona</option><option value="name">Sort: name</option>
      </select>
      <button class="btn-hc" onclick="approveHC()">✓ Approve 80%+</button>
      <button class="btn-aa" onclick="approveAll()">✓ Approve all</button>
    </div>
    <div class="tw" id="rtw">${renderTable(gv())}</div>
  </div>`;
}

function renderTable(vis){
  if(!vis.length)return'<div style="padding:28px;text-align:center;color:#94A3B8;font-size:13px">No contacts match the current filters.</div>';
  const rows=vis.slice(0,300);
  return`<table>
    <colgroup><col style="width:13%"><col style="width:21%"><col style="width:13%"><col style="width:18%"><col style="width:8%"><col style="width:15%"><col style="width:12%"></colgroup>
    <thead><tr><th>Name</th><th>Job title</th><th>Company</th><th>Persona</th><th>Conf.</th><th>Reason</th><th>Action</th></tr></thead>
    <tbody>${rows.map(r=>{
      const col=r.sp?(PCOLS[r.sp]||'#374151'):'#CBD5E1';
      const rb=r.status==='approved'?'row-ok':r.status==='skipped'?'row-sk':'';
      const cc=r.conf>=80?'#16A34A':r.conf>=60?'#D97706':'#EF4444';
      const chip=r.sp?`<span class="pchip" style="color:${col};border-color:${col}40;background:${col}18">${esc(r.sp)}</span>`:`<span class="nm">No match</span>`;
      const conf=r.conf>0?`<div class="cb"><div class="ct"><div class="cf" style="width:${r.conf}%;background:${cc}"></div></div><span style="font-size:11px;color:#64748B;min-width:24px">${r.conf}%</span></div>`:'';
      let act='';
      if(r.status==='pending'&&r.sp)act=`<div class="acell"><button class="btn-sm btn-ok" onclick="apv('${r.id}')">✓</button><button class="btn-sm btn-sk" onclick="skp('${r.id}')">✕</button></div>`;
      else if(r.status==='approved')act=`<button class="btn-sm btn-ok" onclick="und('${r.id}')">✓ done</button>`;
      else if(r.sp)act=`<button class="btn-sm btn-undo" onclick="und('${r.id}')">undo</button>`;
      return`<tr class="${rb}"><td style="font-weight:500">${esc(r.fn)} ${esc(r.ln)}</td><td style="color:#475569" title="${esc(r.title)}">${esc(r.title)}</td><td style="color:#94A3B8" title="${esc(r.company)}">${esc(r.company)}</td><td>${chip}</td><td>${conf}</td><td class="rc" title="${esc(r.reason)}">${esc(r.reason)}</td><td>${act}</td></tr>`;
    }).join('')}</tbody>
  </table>${vis.length>300?`<div style="padding:10px;text-align:center;color:#94A3B8;font-size:11px;border-top:0.5px solid #F1F5F9">Showing 300 of ${vis.length.toLocaleString()} — use filters to narrow down.</div>`:''}`;
}

function rt(){
  const w=document.getElementById('rtw');
  if(w)w.innerHTML=renderTable(gv());
  const ap=results.filter(r=>r.status==='approved').length;
  const pe=results.filter(r=>r.status==='pending').length;
  const sk=results.filter(r=>r.status==='skipped').length;
  document.getElementById('bpills').innerHTML=`<span class="pill pill-g">${ap} approved</span><span class="pill pill-a">${pe} pending</span><span class="pill pill-m">${sk} no match</span>`;
  const eb=document.querySelector('.btn-ex');if(eb)eb.textContent=`↓ Export ${ap} approved`;
}

renderUpload();
</script>
</body>
</html>
